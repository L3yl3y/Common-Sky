<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Common Sky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  /* Layout: a dashboard of the planet across the top (round, thermometer, sinks, tipping points), the summit and crises beneath it, then your bloc's board and hand, with the other blocs beside it. */
  --night: #11182e;
  --night-2: #18213d;
  --night-3: #222d50;
  --line: rgba(173, 190, 255, .2);
  --text: #eef1fb;
  --muted: #a9b2d4;
  --dawn: #ff9f6b;
  --sun: #ffd27a;
  --sky: #74b9ff;
  --leaf: #6fcf7f;
  --smog: #8b90a0;
  --heat: #ff6b6b;
  --paper: #f8f5ee;
  --ink: #1f2433;
  --f-display: "Sora", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: linear-gradient(180deg, #2a2350 0%, var(--night) 32%) fixed, var(--night); color: var(--text); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.eyebrow, .label, label { display: block; font: 700 11px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.brand { font: 700 24px/1 var(--f-display); letter-spacing: .02em; background: linear-gradient(90deg, var(--sun), var(--dawn)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.top-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.chip.warn { color: var(--heat); border-color: var(--heat); }
.chip.good { color: var(--leaf); border-color: var(--leaf); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 700 14px/1.1 var(--f-body); padding: 10px 15px; border-radius: 10px; border: 1px solid #e0874f; background: linear-gradient(180deg, #ffb685, #ff9156); color: #2b1306; cursor: pointer; box-shadow: 0 2px 0 #b65a2a; transition: transform .1s ease, filter .1s ease; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--line); box-shadow: none; }
.btn.ghost:hover { border-color: var(--dawn); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.green { background: linear-gradient(180deg, #8fe39d, #5cc26d); border-color: #3e9a4f; color: #0d2a14; box-shadow: 0 2px 0 #2f7a3d; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.btn:focus-visible, select:focus-visible, input:focus-visible, .card:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
select, input[type=text] { font: 15px var(--f-body); color: var(--text); background: var(--night); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
.field { display: grid; gap: 5px; }
.check { display: flex; gap: 9px; align-items: center; text-transform: none; letter-spacing: 0; font: 700 14px var(--f-body); color: var(--text); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--dawn); }
.row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
.row > .field { flex: 1 1 120px; }
.panel { padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(10, 14, 32, .45); display: grid; gap: 10px; align-content: start; min-width: 0; }
.panel h2 { font-size: 20px; color: var(--sun); }
.panel h3 { font-size: 16px; color: var(--sun); }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }

/* Cards */
.card { position: relative; width: 168px; flex: none; padding: 9px 10px 10px; border-radius: 12px; background: var(--paper); color: var(--ink); border: 1px solid #ddd5c4; box-shadow: 0 2px 0 #cbbfa6, 0 8px 16px rgba(0,0,0,.3); display: grid; gap: 6px; align-content: start; text-align: left; }
button.card { cursor: pointer; transition: transform .14s ease, box-shadow .14s ease; }
button.card:hover { transform: translateY(-3px); }
.card.sel { box-shadow: 0 0 0 3px var(--dawn), 0 10px 20px rgba(0,0,0,.35); transform: translateY(-6px); }
.card.pay { box-shadow: 0 0 0 3px var(--heat), 0 10px 20px rgba(0,0,0,.35); }
.card .ct { font: 600 13px/1.2 var(--f-display); padding-right: 2px; }
.card .ca { font-size: 12.5px; line-height: 1.35; }
.card .cl { font: 700 10px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: #7a7466; }
.card .cbloc { font: 700 10px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: #8a6d3b; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tg { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 99px; font: 700 11px/1.3 var(--f-body); color: #13182a; }
.strip { width: 168px; padding: 5px 10px; border-radius: 10px 10px 0 0; background: #e9e3d6; color: var(--ink); border: 1px solid #d6cdb9; border-bottom: 0; display: flex; justify-content: space-between; gap: 6px; align-items: center; margin-bottom: -4px; }
.strip .ct { font: 600 11px/1.2 var(--f-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.stack { display: grid; align-content: end; }
.stack-foot { display: grid; gap: 6px; margin-top: 8px; width: 168px; }
.amt { font: 700 13px var(--f-body); color: var(--leaf); }
.stacks { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.hand { display: flex; gap: 10px; flex-wrap: wrap; }
.choices { display: flex; gap: 6px; flex-wrap: wrap; }

/* Dashboard */
.dash { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
.rounds { display: flex; gap: 6px; }
.rounds span { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--f-display); border: 2px solid var(--line); color: var(--muted); }
.rounds span.now { border-color: var(--dawn); color: var(--text); background: rgba(255,159,107,.15); }
.rounds span.past { background: var(--night-3); }
.thermo { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.thermo i { height: 22px; border-radius: 5px; background: var(--night-3); border: 1px solid var(--line); position: relative; overflow: hidden; }
.thermo i.on { border-color: transparent; }
.thermo i span { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ffb26b, #ff6b6b); }
.big { font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.outlook { display: flex; gap: 14px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.outlook div { display: grid; gap: 2px; }
.outlook b { font: 700 20px var(--f-display); }
.planet { display: grid; gap: 4px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.pcells { display: flex; gap: 3px; }
.pcells i { width: 15px; height: 15px; border-radius: 4px; background: var(--night-3); border: 1px solid var(--line); }
.pcells i.tip { border-color: var(--heat); }
.pcells i.on { background: var(--dawn); border-color: var(--dawn); }
.pcells i.tip.on { background: var(--heat); }
.mid { margin-bottom: 12px; }
.stagebar { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,210,122,.08); color: var(--sun); font-weight: 700; }
.ccard { padding: 10px 12px; border-radius: 12px; background: #3a1f2a; border: 1px solid #7d3b4c; display: grid; gap: 5px; }
.ccard h4 { margin: 0; font: 600 15px var(--f-display); color: #ffd0d0; }
.ccard.unknown { background: repeating-linear-gradient(135deg, #2a2038 0 8px, #241c31 8px 16px); border-color: var(--line); }
.ccards { display: flex; gap: 8px; flex-wrap: wrap; }
.ccards > * { flex: 1 1 200px; }
.gcard { padding: 10px 12px; border-radius: 12px; background: #1d3044; border: 1px solid #355a7c; display: grid; gap: 5px; }
.gcard.active { background: #173d2a; border-color: #3e9a5f; }
.gcard h4 { margin: 0; font: 600 14px var(--f-display); color: #d8ecff; }
.gcard.active h4 { color: #c8f7d4; }
.bar { height: 7px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--sky); }
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }

/* Bloc board */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
.board { display: grid; gap: 12px; min-width: 0; }
.bloc { padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(10, 14, 32, .5); display: grid; gap: 14px; min-width: 0; }
.bloc.mine { border-color: var(--dawn); }
.bloc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.bloc-head h2 { font-size: 22px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 10px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
.energy { display: flex; height: 16px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,.08); position: relative; }
.energy .d { background: var(--smog); }
.energy .c { background: var(--leaf); }
.energy .m { position: absolute; top: -3px; bottom: -3px; width: 3px; background: var(--sun); }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.kv b { font-weight: 700; }
.cic { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
.cic i { height: 12px; border-radius: 3px; background: rgba(255,255,255,.1); }
.cic i.on { background: var(--heat); }
.cic i.th { box-shadow: inset 0 -2px 0 var(--sun); }
.warn-text { color: var(--heat); font-weight: 700; }
.others { display: grid; gap: 10px; }
.other { padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(10,14,32,.45); display: grid; gap: 6px; font-size: 13px; }
.other h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.chron { padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(10,14,32,.45); max-height: 340px; overflow: auto; }
.chron h3 { font-size: 15px; color: var(--sun); }
.chron ol { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 7px; font-size: 13px; }
.chron li { padding-bottom: 7px; border-bottom: 1px solid var(--line); color: var(--muted); }
.chron li:first-child { color: var(--text); }
.k-crisis, .k-heat, .k-lose { color: #ffb3b3 !important; }
.k-saved, .k-win, .k-global { color: #b8f0c4 !important; }
.k-planet { color: var(--sun) !important; }
.prompt { padding: 12px 14px; border-radius: 12px; background: var(--paper); color: var(--ink); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.prompt .btn.ghost { color: var(--ink); border-color: rgba(31,36,51,.3); }
.report { display: grid; gap: 8px; }
.report ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.coach { background: var(--paper); color: var(--ink); border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
.coach .eyebrow { color: #6d6658; }
.chart { width: 100%; max-width: 520px; height: auto; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: center; padding-block: 8px 24px; }
.hero h1 { font-size: clamp(48px, 7vw, 92px); line-height: .95; background: linear-gradient(90deg, var(--sun), var(--dawn) 60%, #ff7a8a); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { font-size: 18px; max-width: 34em; margin-top: 14px; }
.lede + .lede { font-size: 15px; color: var(--muted); margin-top: 8px; }
.namebar { margin-bottom: 12px; }
.namebar .field { width: min(320px, 100%); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.mode { display: grid; gap: 10px; align-content: start; padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: rgba(10,14,32,.45); min-width: 0; }
.mode h2 { font-size: 22px; color: var(--sun); }
.mode > p { color: var(--muted); }
.mode .btn { justify-self: start; }
.hs-list { display: grid; gap: 6px; }
.hs-item { display: flex; gap: 6px; }
.resume { display: flex; gap: 6px; flex-wrap: wrap; }
.primer { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 24px; }
.primer h2 { font-size: 22px; color: var(--sun); }
.steps { list-style: none; counter-reset: s; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; max-width: 66ch; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--f-display); color: var(--ink); background: var(--sun); }
.lobby { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; }
.code { font: 700 52px/1 var(--f-display); letter-spacing: .14em; color: var(--sun); overflow-wrap: anywhere; }
.seats { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.seats li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.tag { font: 700 11px var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(8,10,24,.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(800px, 100%); max-height: 100%; overflow: auto; padding: 24px; border-radius: 16px; background: var(--night-2); border: 1px solid var(--dawn); box-shadow: 0 20px 50px rgba(0,0,0,.5); display: grid; gap: 12px; }
.sheet h2 { font-size: 28px; color: var(--sun); }
.sheet h3 { font-size: 17px; color: var(--sun); margin-top: 6px; }
.sheet ul, .sheet ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.sheet .close { justify-self: end; }
.cover-card { width: min(460px, 100%); text-align: center; justify-items: center; }
.cover-card h2 { font-size: 34px; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--paper); color: var(--ink); padding: 10px 16px; border-radius: 10px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.45); transition: opacity .2s, transform .2s; z-index: 60; width: max-content; max-width: min(92vw, 520px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { background: var(--heat); color: #2a0808; }
@media (max-width: 1100px) { .dash { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 960px) {
  .game, .mid, .hero, .primer { grid-template-columns: minmax(0, 1fr); }
  .modes { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) { .lobby { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) {
  .dash { grid-template-columns: minmax(0, 1fr); }
  .card, .strip, .stack-foot { width: 150px; }
  .stats { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Common Sky</div>
    <div class="top-right" id="topRight"></div>
  </header>
  <main id="screen"></main>
</div>
<div id="cover" class="overlay" hidden></div>
<div id="rules" class="overlay" hidden></div>
<div id="toast" role="status"></div>

async function peerHost(name, settings, resume) {

function makeWriter(ref) {

function processInbox(data) {

  let changed = false;
  msgs.forEach(function (m) {
    let ack = 0;
    if (S.acks && S.acks[cid]) ack = S.acks[cid];
    if (m.n <= ack) return;
    S.acks = Object.assign({}, S.acks);

async function cloudHost(name, settings, resume) {
  const db = ONLINE.db;
  let code = '';
  if (resume) code = resume.code;
  else {
    for (let i = 0; i < 5; i++) {
      code = genCode();
      const s = await db.doc('games/' + code).get();
      if (!s.exists) break;
    }
  }
  const ref = db.doc('games/' + code);
  const w = makeWriter(ref);
  let unsub = null;

  Net.code = code;
  Net.mode = 'host';
  Net.kind = 'online';
  resetUI();
  if (resume) setState(clone(resume.s));
  else setState(lobbyState(name, settings));
  Net.transport.publish();
  unsub = db.collection('games/' + code + '/inbox').onSnapshot(function (snap) {

  }, function (e) { toast(dbErrorText(e), 'bad'); });
}
async function cloudJoin(code, name) {
  const db = ONLINE.db;
  const ref = db.doc('games/' + code);
  const snap = await ref.get();
  if (!snap.exists || !snap.data() || !snap.data().s) throw new Error('There is no room called ' + code + '. Check the code with your host.');
  const inRef = db.doc('games/' + code + '/inbox/' + Net.me);
  const mine = await inRef.get();
  let msgs = [];
  if (mine.exists && mine.data() && Array.isArray(mine.data().msgs)) msgs = clone(mine.data().msgs);
  let seq = 0;
  msgs.forEach(function (m) { if (m.n > seq) seq = m.n; });
  const first = clone(snap.data());
  const acks = first.s.acks || {};
  if ((acks[Net.me] || 0) > seq) seq = acks[Net.me];
  const w = makeWriter(inRef);
  let unsub = null;
  Net.mode = 'guest';
  Net.kind = 'online';
  Net.code = code;
  Net.transport = {
    kind: 'cloud',
    send: function (m) { seq++; msgs.push(Object.assign({}, m, { n: seq })); msgs = msgs.slice(-12); w.push({ client: Net.me, msgs: msgs }); return seq; },
    close: function () { if (unsub) unsub(); }

}

  st.globals.forEach(function (g, gi) {
    if (g.active || c.tags.indexOf(GLOBALS[g.id].tag) < 0) return;
    sup += '<button class="btn ghost small" type="button" data-act="support" data-i="' + gi + '">' + esc(GLOBALS[g.id].title) + '</button>';
  });
  st.crises.forEach(function (cr, ci) {
    if (!cr.face || c.tags.indexOf(CRISES[cr.id].ignore) < 0) return;

  });
  if (sup) h += '<div><span class="label">Support the world</span><div class="choices">' + sup + '</div></div>';
  h += '<div><button class="btn ghost small" type="button" data-act="deselect">Cancel</button></div></div>';
  return h;
}
function payHTML(st, me) {
  const p = st.players[me];
  const front = p.stacks[UI.pay.stack][p.stacks[UI.pay.stack].length - 1];
  const act = CARDS[front].act;
  let extra = '';
  if (act.kind === 'res' && act.arg === 'any') {
    extra += '<div class="choices"><span class="label">Resilience type</span>';
    RES.forEach(function (r) { let on = ''; if (UI.pay.res === r) on = ' style="border-color:var(--ink)"'; extra += '<button class="btn ghost small" type="button" data-act="pay-res" data-r="' + r + '"' + on + '>' + RES_NAME[r] + '</button>'; });
    extra += '</div>';
  }
  if (act.multi) {
    extra += '<div class="choices"><span class="label">Help which bloc?</span>';
    st.players.forEach(function (q, i) { if (i === me) return; let on = ''; if (UI.pay.to === i) on = ' style="border-color:var(--ink)"'; extra += '<button class="btn ghost small" type="button" data-act="pay-to" data-i="' + i + '"' + on + '>' + esc(BLOCS[q.bloc].name) + '</button>'; });
    extra += '</div>';
  }
  let msg = 'Use ' + CARDS[front].title + '.';
  if (act.cost) msg += ' Tap ' + plural(act.cost, 'card') + ' in your hand to discard (' + UI.payPick.length + ' of ' + act.cost + ' chosen).';
  let ready = UI.payPick.length === act.cost;
  if (act.multi && !(UI.pay.to >= 0)) ready = false;
  let dis = ' disabled';
  if (ready) dis = '';
  return '<div class="prompt"><span>' + esc(msg) + '</span>' + extra + '<span class="choices"><button class="btn small green" type="button" data-act="pay-go"' + dis + '>Confirm</button><button class="btn ghost small" type="button" data-act="pay-cancel">Cancel</button></span></div>';
}
function blocHTML(st, me) {
  const p = st.players[me];
  const b = BLOCS[p.bloc];
  const local = st.phase === 'local' && st.status === 'playing';
  const acting = local && !p.done;
  let doneBtn = '';
  if (local) {
    if (p.done) doneBtn = '<span class="chip good">Finished</span><button class="btn ghost small" type="button" data-act="undone">Keep Working</button>';
    else doneBtn = '<button class="btn" type="button" data-act="done">Finish Local Stage</button>';
    if (Net.kind === 'practice' && st.settings.coach && acting) doneBtn = '<button class="btn ghost small" type="button" data-act="hint">Hint</button>' + doneBtn;
  }
  let stacks = '';
  p.stacks.forEach(function (s, i) { stacks += stackHTML(st, me, i, acting); });
  let hand = '';
  p.hand.forEach(function (id) {
    let cls = '';
    if (UI.sel === id) cls = 'sel';
    if (UI.pay && UI.payPick.indexOf(id) >= 0) cls = 'pay';
    hand += cardHTML(id, { button: acting, cls: cls });
  });
  if (!hand) hand = '<p class="note">Your hand is empty.</p>';
  let mid = '';
  if (UI.pay && acting) mid = payHTML(st, me);
  else if (UI.sel >= 0 && acting) mid = selectedHTML(st, me);
  else if (acting && UI.pending) mid = '<div class="prompt"><span>Sending your move to the host…</span></div>';
  else if (acting) mid = '<div class="prompt"><span>Tap a card in your hand to play it, or use the actions on your stacks. Finish when you are happy.</span></div>';
  let coach = '';
  if (UI.coachText && acting) coach = '<aside class="coach"><span class="eyebrow">Coach</span><p>' + UI.coachText + '</p></aside>';
  let who = esc(p.name);
  if (Net.kind !== 'hotseat') who = 'You, ' + who;
  return '<section class="bloc mine"><div class="bloc-head"><div><span class="eyebrow">' + who + '</span><h2 style="color:' + b.colour + '">' + esc(b.name) + '</h2></div><div class="choices">' + doneBtn + '</div></div>' +
    '<div class="stats">' + energyHTML(p) + emisHTML(st, p) + resHTML(st, p) + cicHTML(p) + '</div>' +
    '<div><span class="label">Play Area (' + p.stacks.length + ' of 5 stacks)</span><div class="stacks">' + stacks + '</div></div>' + mid + coach +
    '<div><span class="label">Your Hand (public to the table)</span><div class="hand">' + hand + '</div></div></section>';
}
function otherHTML(st, i) {
  const p = st.players[i];
  const b = BLOCS[p.bloc];
  let status = '';
  if (st.phase === 'local') { if (p.done) status = '<span class="chip good">Finished</span>'; else status = '<span class="chip">Working</span>'; }
  let fronts = p.stacks.map(function (s) { return esc(CARDS[s[s.length - 1]].title); }).join(', ');
  let short = '';
  if (shortfall(p)) short = ' <span class="warn-text">(' + shortfall(p) + ' short)</span>';
  let tag = '';
  if (p.kind === 'bot') tag = ' <span class="tag">Bot</span>';
  return '<article class="other"><h3><i class="dot" style="background:' + b.colour + '"></i>' + esc(b.name) + '</h3><span class="note">' + esc(p.name) + tag + '</span>' + status +
    '<div class="kv"><span>Carbon per round</span><b>' + carbonOf(st, p) + '</b></div><div class="kv"><span>Energy (dirty + clean / demand)</span><b>' + p.dirty + ' + ' + p.clean + ' / ' + p.demand + short + '</b></div>' +
    '<div class="kv"><span>Resilience S / E / I</span><b>' + p.res.social + ' / ' + p.res.eco + ' / ' + p.res.infra + '</b></div><div class="kv"><span>Communities in Crisis</span><b>' + p.cic + '</b></div><div class="kv"><span>Cards in hand</span><b>' + p.hand.length + '</b></div><p class="note">Stacks: ' + fronts + '</p></article>';
}
function reportHTML(st, me) {
  let lines = '';
  st.report.forEach(function (r) { lines += '<li class="k-' + esc(r.k) + '">' + esc(r.txt) + '</li>'; });
  let btn = '<button class="btn" type="button" data-act="continue">Start Round ' + (st.round + 1) + '</button>';
  return '<section class="panel report" style="border-color:var(--sun)"><h2>Round ' + st.round + ' Report</h2><ol>' + lines + '</ol><div class="row">' + btn + '</div></section>';
}
function chartHTML(st) {
  const h = st.history;
  if (!h.length) return '';
  const W = 520;
  const H = 180;
  let max = 10;
  h.forEach(function (r) { max = Math.max(max, r.emitted, r.absorbed); });
  const bw = (W - 60) / ROUNDS;
  let svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Emitted and absorbed carbon by round">';
  for (let g = 0; g <= 4; g++) { const y = 20 + (H - 50) * g / 4; svg += '<line x1="40" x2="' + (W - 10) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.08)"/><text x="34" y="' + (y + 4) + '" text-anchor="end" font-size="10" fill="#a9b2d4">' + Math.round(max * (1 - g / 4)) + '</text>'; }
  h.forEach(function (r, i) {
    const x = 46 + i * bw;
    const he = (H - 50) * r.emitted / max;
    const ha = (H - 50) * r.absorbed / max;
    svg += '<rect x="' + x + '" y="' + (H - 30 - he) + '" width="' + (bw * 0.38) + '" height="' + he + '" rx="3" fill="#8b90a0"/>';
    svg += '<rect x="' + (x + bw * 0.42) + '" y="' + (H - 30 - ha) + '" width="' + (bw * 0.38) + '" height="' + ha + '" rx="3" fill="#6fcf7f"/>';
    svg += '<text x="' + (x + bw * 0.4) + '" y="' + (H - 14) + '" text-anchor="middle" font-size="11" fill="#a9b2d4">R' + r.round + '</text>';
  });
  svg += '</svg>';
  return '<div><span class="label">Grey: emitted. Green: absorbed.</span>' + svg + '</div>';
}
function finalHTML(st) {
  let title = 'The Planet Is Saved';
  if (st.result !== 'win') title = 'The Climate Slipped Away';
  let btn = '<button class="btn" type="button" data-act="again">Play Again</button>';
  if (Net.mode === 'guest') btn = '<p class="muted">The host can start another game.</p>';
  return '<section class="panel" style="border-color:var(--sun)"><span class="eyebrow">Round ' + st.round + ' · ' + degrees(st.therm.bands) + '°C</span><h2 style="font-size:34px">' + title + '</h2><p>' + esc(st.reason) + '</p>' + chartHTML(st) + '<div class="row">' + btn + '<button class="btn ghost" type="button" data-act="leave">Back To Menu</button></div></section>';
}
function logHTML(st) {
  let items = '';
  st.log.slice(-60).reverse().forEach(function (e) { items += '<li class="k-' + esc(e.k) + '">' + esc(e.txt) + '</li>'; });
  return '<aside class="chron" aria-label="Chronicle"><h3>Chronicle</h3><ol>' + items + '</ol></aside>';
}
function renderGame() {
  const st = S;
  const me = mySeat();
  let main = '';
  if (st.status === 'over') main += finalHTML(st);
  if (st.phase === 'report') main += reportHTML(st, me);
  main += globalsHTML(st, me);
  if (me >= 0) main += blocHTML(st, me);
  let side = '';
  st.players.forEach(function (p, i) { if (i !== me) side += otherHTML(st, i); });
  side += logHTML(st);
  $('#screen').innerHTML = dashHTML(st) + '<div class="mid">' + crisisHTML(st, me) + '</div><div class="game"><div class="board"><p class="stagebar">' + esc(stageText(st)) + '</p>' + main + '</div><div class="others">' + side + '</div></div>';
}
function stageText(st) {
  if (st.status === 'over') return 'The game is over.';
  if (st.phase === 'global') return 'Global stage: review the forecast crisis and choose a Global Project together.';
  if (st.phase === 'local') {
    const waiting = st.players.filter(function (p) { return !p.done; }).map(function (p) { return BLOCS[p.bloc].name; });
    return 'Local stage: everyone plays at the same time. Still working: ' + waiting.join(', ') + '.';
  }
  if (st.phase === 'report') return 'Emissions, Crisis and Growth stages are resolved. Read the report, then start the next round.';
  return '';
}
function renderCover() {
  const c = $('#cover');
  let show = false;
  if (Net.kind === 'hotseat' && S && S.status === 'playing' && S.phase === 'local') {
    const a = activeHotseat();
    if (a !== UI.revealed && !S.players[a].done) show = true;
  }
  if (!show) { c.hidden = true; c.innerHTML = ''; return; }
  const p = S.players[activeHotseat()];
  c.hidden = false;
  c.innerHTML = '<div class="sheet cover-card"><span class="eyebrow">Pass the screen</span><h2>' + esc(p.name) + '</h2><p>Your turn to lead the ' + esc(BLOCS[p.bloc].name) + ' in the Local stage.</p><button class="btn" type="button" data-act="reveal">I Am Ready</button></div>';
}
const RULES_HTML =
  '<div class="sheet" role="dialog" aria-label="Rules"><button class="btn ghost small close" type="button" data-act="close-rules">Close</button>' +
  '<h2>How To Play</h2><p>Common Sky is cooperative. Each player leads a world bloc. Together you must reach drawdown, where Trees, Oceans and air capture absorb more Carbon than the world emits, before the end of round 6.</p>' +
  '<h3>Your Bloc</h3><ul><li><b>Energy:</b> Dirty plus Clean Energy must meet your Energy Demand, or the shortfall becomes Communities in Crisis.</li><li><b>Carbon:</b> every Dirty Energy and Emissions token emits 1 Carbon each round.</li><li><b>Resilience:</b> Social, Ecological and Infrastructure tokens reduce crisis effects on you. They are never spent.</li><li><b>Communities in Crisis:</b> at 4 you draw 1 fewer card, at 8 you draw 2 fewer, and at 12 everyone loses.</li></ul>' +
  '<h3>Each Round</h3><ol><li><b>Global:</b> draw Crisis cards (more as it warms). One is forecast face up. Choose one of two Global Projects, or none. Up to 4 can be in play.</li><li><b>Local:</b> draw 5 cards, then everyone plays at once, in any order, as much as they like. Play a card in front of a stack (up to 5 stacks) to use its action, tuck it behind a stack to add its tags, tuck it under a Global Project to work towards it, or tuck it under the forecast crisis to stop it. Actions count the matching tags in their whole stack, and only the front card’s action can be used. Most actions work once per round; some cost cards from your hand. Unused cards stay in your hand.</li><li><b>Emissions:</b> check Energy Demand, then add up Carbon. Sinks absorb what they can. If they have spare capacity, you reach drawdown and pull Carbon back off the Thermometer. Otherwise the excess fills the Thermometer, and each full row adds a Temperature Band (0.1°C).</li><li><b>Crisis:</b> roll the planetary die once per band. Each roll advances a tipping-point track, and red spaces trigger their effect. Then resolve every Crisis card. A crisis is ignored if enough matching tags were tucked under it, and Resilience of the listed type reduces it for you.</li><li><b>Growth:</b> win if you reached drawdown this round. Otherwise each bloc’s Energy Demand grows.</li></ol>' +
  '<h3>Losing</h3><p>The Thermometer reaches 2.0°C (8 bands), any bloc reaches 12 Communities in Crisis, or round 6 ends without drawdown.</p>' +
  '<h3>Tips</h3><ul><li>Add Clean Energy before removing Dirty Energy, or you will fall short of demand.</li><li>Cut big emissions early: every Carbon saved counts in every later round.</li><li>Keep one Resilience of each type per Temperature Band.</li><li>Global Projects help everyone. Pool tags to finish them.</li></ul></div>';
function openRules() { const r = $('#rules'); r.innerHTML = RULES_HTML; r.hidden = false; const b = r.querySelector('.close'); if (b) b.focus(); }
function closeRules() { const r = $('#rules'); r.hidden = true; r.innerHTML = ''; }

/* ---------- Input ---------- */

function showHint() {
  const me = mySeat();
  const a = botLocal(S, me);
  let t = '';
  if (a.type === 'done') t = 'Nothing else is clearly worth doing this round. Finish the Local stage.';
  else if (a.type === 'take') t = 'Use the action on <b>' + esc(CARDS[S.players[me].stacks[a.stack][S.players[me].stacks[a.stack].length - 1]].title) + '</b>.';
  else if (a.type === 'play') { UI.sel = a.card; let where = 'a new stack'; if (a.stack >= 0) where = 'the front of ' + esc(CARDS[S.players[me].stacks[a.stack][S.players[me].stacks[a.stack].length - 1]].title); t = 'Play <b>' + esc(CARDS[a.card].title) + '</b> on ' + where + ', then use it.'; }
  else if (a.type === 'tuck') { UI.sel = a.card; t = 'Tuck <b>' + esc(CARDS[a.card].title) + '</b> behind ' + esc(CARDS[S.players[me].stacks[a.stack][S.players[me].stacks[a.stack].length - 1]].title) + ' to boost it.'; }
  else if (a.type === 'support') { UI.sel = a.card; t = 'Tuck <b>' + esc(CARDS[a.card].title) + '</b> under ' + esc(GLOBALS[S.globals[a.g].id].title) + '.'; }
  else if (a.type === 'ctuck') { UI.sel = a.card; t = 'Tuck <b>' + esc(CARDS[a.card].title) + '</b> under the forecast crisis to help stop it.'; }
  const p = S.players[me];
  if (shortfall(p)) t += ' Watch out: you are ' + shortfall(p) + ' short of Energy Demand.';
  UI.coachText = t;
  render();
}
function copyInvite() {
  let text = Net.code;
  if (Net.transport && Net.transport.kind === 'peer' && /^https?:$/.test(location.protocol)) text = location.href.split('#')[0] + '#join-' + Net.code;
  try {
    navigator.clipboard.writeText(text).then(function () { toast('Copied: ' + text); }, function () { toast('Copy failed. The code is ' + Net.code + '.'); });
  } catch (e) { toast('The code is ' + Net.code + '.'); }
}
function startTake(si) {
  const me = mySeat();
  const p = S.players[me];
  const front = p.stacks[si][p.stacks[si].length - 1];
  const act = CARDS[front].act;
  UI.sel = -1;
  if (act.cost === 0 && !act.multi && !(act.kind === 'res' && act.arg === 'any')) { dispatch({ type: 'take', seat: me, stack: si, pay: [] }); return; }
  UI.pay = { stack: si, res: weakest(p), to: -1 };
  UI.payPick = [];
  render();
}
function handleAct(act, el) {
  const me = mySeat();
  if (act === 'practice-start') startPractice();
  else if (act === 'hotseat-start') startHotseat();
  else if (act === 'hs-add') { readHsNames(); if (UI.hsNames.length < 4) UI.hsNames.push('Delegate ' + (UI.hsNames.length + 1)); renderHsNames(); }
  else if (act === 'hs-remove') { readHsNames(); if (UI.hsNames.length > 2) UI.hsNames.splice(Number(el.dataset.i), 1); renderHsNames(); }
  else if (act === 'online-create') onlineCreate();
  else if (act === 'online-join') onlineJoin();
  else if (act === 'resume') onlineResume(el.dataset.code);
  else if (act === 'rules') openRules();
  else if (act === 'close-rules') closeRules();
  else if (act === 'add-bot') applyAction({ type: 'addBot' }, false);
  else if (act === 'remove-player') applyAction({ type: 'removePlayer', index: Number(el.dataset.i) }, false);
  else if (act === 'start') applyAction({ type: 'start' }, false);
  else if (act === 'again') applyAction({ type: 'again' }, false);
  else if (act === 'copy-code') copyInvite();
  else if (act === 'leave-ask') {
    if (UI.confirmLeave) { leaveGame(); return; }
    UI.confirmLeave = true;
    renderTop();
    setTimeout(function () { UI.confirmLeave = false; renderTop(); }, 3000);
  }
  else if (act === 'leave') leaveGame();
  else if (act === 'pick-global') { const a = { type: 'pickGlobal', pick: Number(el.dataset.i), replace: UI.replace }; UI.replace = -1; dispatch(a); }
  else if (act === 'replace') { UI.replace = Number(el.dataset.i); render(); }
  else if (act === 'continue') dispatch({ type: 'continue' });
  else if (act === 'done') { UI.sel = -1; UI.pay = null; UI.coachText = ''; dispatch({ type: 'done', seat: me, done: true }); }
  else if (act === 'undone') dispatch({ type: 'done', seat: me, done: false });
  else if (act === 'deselect') { UI.sel = -1; render(); }
  else if (act === 'play' || act === 'tuck') { const card = UI.sel; UI.sel = -1; dispatch({ type: act, seat: me, card: card, stack: Number(el.dataset.i) }); }
  else if (act === 'support') { const card = UI.sel; UI.sel = -1; dispatch({ type: 'support', seat: me, card: card, g: Number(el.dataset.i) }); }
  else if (act === 'ctuck') { const card = UI.sel; UI.sel = -1; dispatch({ type: 'ctuck', seat: me, card: card, c: Number(el.dataset.i) }); }
  else if (act === 'take') startTake(Number(el.dataset.i));
  else if (act === 'pay-res') { UI.pay.res = el.dataset.r; render(); }
  else if (act === 'pay-to') { UI.pay.to = Number(el.dataset.i); render(); }
  else if (act === 'pay-cancel') { UI.pay = null; UI.payPick = []; render(); }
  else if (act === 'pay-go') { const a = { type: 'take', seat: me, stack: UI.pay.stack, pay: UI.payPick.slice(), res: UI.pay.res, to: UI.pay.to }; UI.pay = null; UI.payPick = []; dispatch(a); }
  else if (act === 'hint') showHint();
  else if (act === 'reveal') { UI.revealed = activeHotseat(); render(); }
}
document.addEventListener('click', function (e) {
  if (e.target.id === 'rules') { closeRules(); return; }
  const el = e.target.closest('[data-act],[data-hand]');
  if (!el || el.disabled) return;
  if (el.dataset.hand !== undefined) {
    const id = Number(el.dataset.hand);
    if (UI.pay) {
      const k = UI.payPick.indexOf(id);
      const p = S.players[mySeat()];
      const front = p.stacks[UI.pay.stack][p.stacks[UI.pay.stack].length - 1];
      if (k >= 0) UI.payPick.splice(k, 1);
      else if (UI.payPick.length < CARDS[front].act.cost) UI.payPick.push(id);
      render();
      return;
    }
    if (UI.sel === id) UI.sel = -1;
    else UI.sel = id;
    render();
    return;
  }
  handleAct(el.dataset.act, el);
});
document.addEventListener('keydown', function (e) {
  const tag = e.target && e.target.tagName;
  if (e.key === 'Escape' && !$('#rules').hidden) { closeRules(); return; }
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
    if (e.key === 'Enter' && e.target.id === 'on-code') onlineJoin();
    return;
  }
  if (e.key === 'Escape' && (UI.sel >= 0 || UI.pay)) { UI.sel = -1; UI.pay = null; UI.payPick = []; render(); }
});
setInterval(function () {
  if (UI.pending && Date.now() - UI.pending > 8000) { UI.pending = 0; UI.pendingN = 0; toast('No answer from the host yet. They may have lost their connection.', 'bad'); render(); }
}, 500);

window.__sky = { peek: function () { return { S: S, me: mySeat(), net: Net.mode, kind: Net.kind, sel: UI.sel, pay: UI.pay, pending: UI.pending }; }, setBotSpeed: function (s) { botSpeed = s; }, reduce: reduce, botLocal: botLocal, botGlobal: botGlobal, CARDS: CARDS, GLOBALS: GLOBALS };

render();
if (ONLINE.env === 'cloud-pending') initCloud();
})();
</script>
